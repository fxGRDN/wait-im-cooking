<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self' ipc:; img-src 'self' asset: https: data: http://asset.localhost http://*.localhost; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://tauri.localhost http://localhost:* blob:; connect-src 'self' ipc: https: ws: http://ipc.localhost http://localhost:* ws://localhost:* http://tauri.localhost ws://tauri.localhost;"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <title>Wait, I'm Cooking!</title>
        <script>
            (() => {
                const stored = localStorage.getItem("wait-im-cooking-theme");
                const theme =
                    stored === "light" || stored === "dark"
                        ? stored
                        : window.matchMedia("(prefers-color-scheme: dark)")
                                .matches
                          ? "dark"
                          : "light";

                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
